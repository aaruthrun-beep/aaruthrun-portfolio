  <script>
(function(){
  try {
    var k = "portfolio-theme";
    var v = localStorage.getItem(k);
    if (v !== "light" && v !== "dark") {
      v = "light";
      try { localStorage.setItem(k, v); } catch(e) {}
    }
    if (v === "light") {
      document.documentElement.setAttribute("data-theme","light");
    }
  } catch(e) {
    document.documentElement.setAttribute("data-theme","light");
  }
})();
</script>
