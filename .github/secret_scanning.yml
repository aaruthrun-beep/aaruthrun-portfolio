# Secret scanning
#
# config/firebase.config.js holds the Firebase Web SDK config. The apiKey in it
# is a public browser identifier, not a credential: it ships to every visitor by
# design, and access is controlled by Firebase Authentication and the Firestore
# security rules. The key is restricted in Google Cloud to the Firebase APIs the
# site uses, so it cannot be used against other Google services.
#
# Secret scanning should still cover every other file in the repository.
paths-ignore:
  - "config/firebase.config.js"
