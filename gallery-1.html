<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
(function(){
  try {
    var k = "portfolio-theme";
    var v = localStorage.getItem(k);
    if (v !== "light" && v !== "dark") {
      v = "light";
      try { localStorage.setItem(k, v); } catch(e) {}
    }
    if (v === "light") {
      document.documentElement.setAttribute("data-theme","light");
    }
  } catch(e) {
    document.documentElement.setAttribute("data-theme","light");
  }
})();
</script>
  <title>Gallery 1 — Row Reel — Aaruthrun</title>
  <meta name="description" content="Project photos in three auto-scrolling rows, one row per project.">

  <link rel="stylesheet" href="css/style.css?v=2026-11-27">
  <link rel="stylesheet" href="config/design-tokens.css?v=2026-11-08">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/readability.css?v=2026-11-16">
  <link rel="stylesheet" href="styles/gallery-rows.css?v=2026-11-22b">
</head>
<body class="gallery-rows-body">

  <header id="site-header" style="flex-shrink: 0; z-index: 1000; background: var(--bg);"></header>

  <main class="gr-main" id="gr-main">
    <!-- Rows are rendered by gallery-rows.js from data/gallery.json -->
    <div id="gr-rows"></div>
  </main>

  <div class="gr-hint">AUTO-SCROLLING ROWS &middot; SCROLL FOR MORE PROJECTS</div>

  <script src="config/app.config.js?v=2026-11-27"></script>
  <script src="modules/theme/theme-manager.js?v=2026-11-08"></script>
  <script src="modules/header/header-manager.js?v=2026-11-08"></script>
  <script src="modules/gallery/gallery-rows.js?v=2026-11-22e"></script>
  <script src="js/app.js"></script>
</body>
</html>
