        <h1>Smart Rover — Scrap-Built Robot from Class 8</h1>
        <p class="mono-spec">Class 8 Build // Scrap Parts Only // 4 Gear-Motor Chassis // 3-Axis Arm // Manually Controlled</p>
        <p>A rover built in class 8 out of whatever scraps I could find: a PVC-pipe frame lashed with rope over wooden cross members, four salvaged gear motors for wheels, and a three-axis arm on a painted wooden deck. It is driven by hand, and it was shown together with a water sensor, a fire alarm and a non-contact voltage detector carried on the machine.</p>
